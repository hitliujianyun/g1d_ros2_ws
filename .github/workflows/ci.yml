name: ci

on:
  push:
    branches-ignore: ["exp/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-text:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_text.py

  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "src/g1d_core[test]"
      - run: python -m pytest src/g1d_core/test -q

  ros:
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    env:
      RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      ROS_DOMAIN_ID: "42"
      PYTHONUNBUFFERED: "1"
      G1D_TEST_REPORT_DIR: ${{ github.workspace }}/test_reports
    defaults:
      run:
        shell: bash
    steps:
      - name: git for checkout
        run: apt-get update && apt-get install -y --no-install-recommends git
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: dependencies
        run: scripts/ci/install_deps.sh
      - name: build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-up-to-regex '^g1d_' --event-handlers console_cohesion+
      - name: test
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --packages-select-regex '^g1d_' --executor sequential \
            --event-handlers console_cohesion+ --pytest-args -q
          colcon test-result --verbose
      - name: measured values
        if: always()
        run: |
          for f in test_reports/*.json; do [ -f "$f" ] && echo "$f: $(cat "$f")"; done
          grep -ho 'testcase classname="[^"]*" name="[^"]*"' build/*/pytest.xml || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-test-logs
          path: |
            log/
            test_reports/
            build/*/pytest.xml
            build/*/test_results/
          if-no-files-found: ignore
