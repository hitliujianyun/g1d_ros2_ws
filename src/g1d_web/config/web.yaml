# g1d_web 配置。守护的限速等数值从 g1d_guard 的参数文件读取（--guard-config）。
web:
  host: 0.0.0.0
  port: 8080
  maps_dir: exports            # 相对 --root（默认 ~/g1d_web）：Web 累积地图的导出
  missions_dir: missions
  tests_dir: tests
  scan_max_points: 30000
  map_voxel: 0.05
  map_max_points: 3000000
  grid_resolution: 0.05
  grid_z_min: 0.08
  grid_z_max: 1.85

robot:
  footprint: [[0.30, 0.28], [0.30, -0.28], [-0.30, -0.28], [-0.30, 0.28]]
  rotate_radius: 0.38
  chassis_laser:
    xyz: [0.1871, -0.016137, 0.20085]

mppi:                          # 与 g1d_bringup/config/nav2.yaml 一致（仅显示）
  vx_max: 0.40
  wz_max: 0.60
