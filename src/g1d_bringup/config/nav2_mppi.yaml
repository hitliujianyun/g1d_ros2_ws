# MPPI（RotationShim + MPPIController）控制器配置。navigation.launch.py controller:=mppi 时，
# 用它整块替换 nav2.yaml 的 controller_server.FollowPath。数值沿用 g1d_ws 仿真调过的值。
# 注意：CI 仿真中该配置平均速度只有约 0.05 m/s 且不跟随路径（见 PLAN.md 进度记录），上机须重新调参验证。
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_mppi_controller::MPPIController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      # --- MPPI (primary controller, same namespace) ---
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 0.40
      vx_min: -0.10
      vy_max: 0.0
      wz_max: 0.60
      ax_max: 0.5
      ax_min: -1.0
      ay_max: 0.0
      az_max: 1.0
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      prune_distance: 1.7
      transform_tolerance: 0.2
      regenerate_noises: false
      visualize: false
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
