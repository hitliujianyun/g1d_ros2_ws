# 自身点过滤盒子：[xmin, xmax, ymin, ymax, zmin, zmax]，坐标系任意（每帧按 TF 放置）。
# 数值为 g1d_ws 估计值【待实测】：机器人静止、导航姿态下录一段点云，调整到车身附近没有稳定点簇。
self_filter:
  ros__parameters:
    lidar_frame: livox_frame
    min_range: 0.3
    boxes: [torso, arms, chassis]
    torso:                       # 头、躯干、立柱（相对头部固定）
      frame: head_link
      box: [-0.20, 0.20, -0.25, 0.25, -0.95, 0.10]
    arms:                        # 收拢的手臂
      frame: head_link
      box: [-0.25, 0.40, -0.45, 0.45, -0.85, 0.05]
    chassis:                     # 底盘（557 x 525 mm）
      frame: base_link
      box: [-0.32, 0.32, -0.30, 0.30, -0.05, 0.70]
